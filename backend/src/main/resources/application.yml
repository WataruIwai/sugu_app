server:
    port: ${PORT:8080}

spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USER}
        password: ${DB_PASSWORD}

    flyway:
        enabled: true
        baseline-on-migrate: true
        locations: classpath:db/migration

jwt:
    secret: ${JWT_SECRET}
    expiration: 48h

usage:
    bonus-amount: 3

apple:
    signin:
        audience: ${EXPO_PUBLIC_IOS_BUNDLE_ID}

openai:
    api-key: ${OPENAI_API_KEY}
